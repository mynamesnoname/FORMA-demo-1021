[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "FORMA"
version = "0.1.0"
description = "FORMA — LLM-driven agent for human-like analysis of 1D astronomical spectra"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "FORMA Team"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "astropy>=7.2.0",
    "h5py>=3.16.0",
    "httpx[socks]>=0.28.1",
    "langchain>=1.2.0",
    "langchain-core>=1.2.2",
    "langchain-openai>=1.1.4",
    "langgraph>=1.0.3,<1.1.0",
    "matplotlib>=3.10.6",
    "numpy>=2.2.6",
    "pandas>=2.3.2",
    "pydantic>=2.11.7",
    "python-dotenv>=1.1.1",
    "PyWavelets>=1.9.0",
    "scipy>=1.16.3",
    "specutils>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "debugpy>=1.8.16",
    "ipython>=8.12.3",
    "ipykernel>=6.30.1",
    "notebook>=7.4.5",
    "jupyterlab>=4.4.7",
]

[project.urls]
Homepage = "https://github.com/mynamesnoname/FORMA-demo-1021"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"FORMA.agentic_graph" = ["data/*.json", "prompts/*.md"]

[tool.setuptools.package-dir]
"" = "src"
