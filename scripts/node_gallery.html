<html lang="zh-CN">
<head>

<title>FORMA · Reasoning Atlas</title>
<style>
  :root{--bg:#070a10;--panel:#101722;--panel2:#141d2a;--line:#263544;--text:#ecf3f5;--muted:#99aab6;--cyan:#77d9e8;--mint:#94e2be;--amber:#e9c785;--violet:#b8a7e9;--rose:#edaaa9}
  *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(900px 560px at 82% -10%,#12343b70,transparent 70%),radial-gradient(700px 600px at -15% 50%,#19253b75,transparent 70%),var(--bg);color:var(--text);font-family:Inter,"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;min-height:100vh}
  button,input{font:inherit}button{cursor:pointer}a{color:var(--cyan);text-decoration:none}a:hover{text-decoration:underline}
  .shell{max-width:1600px;margin:auto;padding:0 42px 80px}.top{height:78px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
  .logo{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.14em;font-size:18px}.logo i{display:inline-block;width:25px;height:25px;border:2px solid var(--cyan);transform:rotate(45deg);box-shadow:0 0 18px #67dbe570}.logo span{color:var(--cyan)}
  .top-right,.eyebrow,.mono,.chip,.stage-tab,.meta,.kpi-label,.card-kicker,.number,.link-row{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Consolas,monospace}
  .top-right{font-size:11px;color:var(--muted);letter-spacing:.13em;text-transform:uppercase}.hero{padding:55px 0 34px}.eyebrow{color:var(--cyan);font-size:12px;letter-spacing:.22em;text-transform:uppercase;margin:0 0 13px}.hero h1{font-size:clamp(42px,5vw,76px);line-height:1.02;letter-spacing:-.055em;margin:0 0 16px;font-weight:750}.hero h1 em{font-style:normal;color:var(--cyan)}.hero p{color:var(--muted);font-size:17px;max-width:790px;line-height:1.65;margin:0}.run-pill{display:inline-flex;gap:10px;align-items:center;margin-top:22px;border:1px solid #36606a;border-radius:100px;padding:9px 15px;color:#b6dbe0;font:12px ui-monospace,monospace;background:#0c2228}.dot{width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 12px var(--mint)}

  .hero{padding:34px 0 20px}.hero h1{font-size:clamp(34px,4vw,58px);margin-bottom:10px}.hero h1 br{display:none}.hero p{font-size:14px;max-width:1000px}.run-pill{margin-top:14px}.section-head{margin-top:24px}.summary{margin-top:28px}

  .toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:17px}.search{flex:1;min-width:230px;background:#0e1823;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:12px 14px;outline:none}.search:focus{border-color:var(--cyan)}select{background:#0e1823;color:var(--text);border:1px solid var(--line);padding:11px;border-radius:10px;min-width:132px}.toolbar-count{font:11px ui-monospace,monospace;color:var(--muted);margin-left:auto}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.card{position:relative;min-height:148px;display:flex;flex-direction:column;text-align:left;color:var(--text);background:#111b26;border:1px solid var(--line);border-radius:13px;padding:19px 21px;transition:transform .18s,border .18s,box-shadow .18s;overflow:hidden}.card:hover{transform:translateY(-3px);border-color:#5997a2;box-shadow:0 13px 30px #0004}.card:before{content:'';position:absolute;top:0;left:0;bottom:0;width:3px;background:var(--cyan);opacity:.75}.card[data-stage='FA']:before{background:var(--violet)}.card[data-stage='GRAPH']:before{background:var(--mint)}.card[data-stage='HS']:before{background:var(--amber)}.card-kicker{display:flex;justify-content:space-between;align-items:center;color:var(--cyan);font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:13px}.card-kicker .state{letter-spacing:0;color:var(--muted);background:#21303a;border-radius:30px;padding:3px 8px}.card h3{font-size:17px;line-height:1.3;margin:0 0 7px;font-weight:620}.card p{font-size:12px;color:#aabdc7;line-height:1.45;margin:0 0 15px;overflow-wrap:anywhere}.card .bottom{margin-top:auto;display:flex;justify-content:space-between;align-items:center;color:#7f9ca8;font-size:11px}.card .bottom strong{color:#dbe9e9;font-weight:500}.more{display:block;margin:24px auto 0;background:#12313a;color:var(--cyan);border:1px solid #467984;border-radius:11px;padding:11px 22px}.empty{padding:50px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px;grid-column:1/-1}

  /* Scientific minimalism: the observation and the selected reasoning path carry the emphasis. */
  :root{--bg:#090a0c;--panel:#111317;--panel2:#15181d;--line:#33363d;--text:#f5f5f4;--muted:#a1a1aa;--cyan:#74c7d5;--mint:#c8ced0;--amber:#c8ced0;--violet:#c8ced0}
  body{background:var(--bg)}

  .run-pill{background:transparent;border-color:var(--line);color:var(--muted)}.dot{background:var(--cyan);box-shadow:none}

  .sidebar,.card,.field,.list-item,.drawer{background:var(--panel)}.card{border-radius:5px}.card:hover{transform:none;box-shadow:none;border-color:var(--muted)}.card:before,.card[data-stage='FA']:before,.card[data-stage='GRAPH']:before,.card[data-stage='HS']:before{background:#6c777c;width:2px}.card-kicker{color:var(--muted)}.card .bottom strong{color:var(--cyan)}.stage-tab.active{background:#19262b}
  .veil{backdrop-filter:blur(3px)}.drawer{border-left-color:var(--line)}.link-row a{background:#172226}
  @media(max-width:1100px){.shell{padding:0 25px 60px}.sample-strip{grid-template-columns:repeat(3,1fr)}.hero{grid-template-columns:1fr 1fr;gap:22px}.workspace{grid-template-columns:1fr}.sidebar{position:static;display:flex;flex-wrap:wrap;gap:3px}.side-title,.side-note{display:none}.stage-tab{width:auto;min-width:105px}}
  @media(max-width:660px){.shell{padding:0 15px 40px}.top-right{display:none}.hero{display:block;padding:28px 0 18px}.hero h1 br{display:block}.hero-spectrum{margin-top:20px}.sample-strip{grid-template-columns:repeat(2,1fr)}.sample{min-height:85px;padding:12px}.cards{grid-template-columns:1fr}.summary-main{padding:20px}.kpis{gap:18px}.drawer{padding:22px}.fields{grid-template-columns:1fr}.graph-canvas{height:500px}.graph-top{left:12px;right:12px;top:10px;align-items:flex-start}.graph-tag{display:none}.graph-controls{justify-content:flex-start}.graph-bottom{display:block;line-height:1.6}}
  /* Demo hierarchy: sample, graph, then observed evidence and selected decision. */
  .top{height:52px}.logo{font-size:15px;letter-spacing:.08em}.logo span{font-weight:450;color:var(--muted);font-size:11px}.top-right{letter-spacing:.04em}
  .hero{display:flex;justify-content:space-between;align-items:center;gap:24px;padding:18px 0 11px}.hero .eyebrow,.hero p,.hero-spectrum{display:none}.hero h1{font-size:clamp(22px,3vw,35px);line-height:1.1;margin:0}.hero h1 em{color:var(--cyan)}.run-pill{margin:0;font-size:10px;white-space:nowrap}
  .sample-strip{display:flex;gap:5px;overflow-x:auto;padding:3px 0 10px}.sample{min-height:0;min-width:96px;padding:7px 12px;border-radius:4px;background:transparent}.sample strong{font-size:12px;margin:0}.sample span{display:none}.sample.active{background:#1b2528;box-shadow:none}
  .section-head{margin:13px 0 8px}.section-head h2{font-size:13px}.section-head small{font-size:10px}.graph-canvas{height:clamp(470px,64vh,700px)}.graph-bottom{font-size:10px}
  .evidence-panel{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(250px,1fr);gap:1px;border:1px solid var(--line);background:var(--line);margin-top:10px}.evidence-spectrum,.selected-node{background:var(--panel);padding:16px 19px;min-width:0}.evidence-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.evidence-panel h3{font:10px ui-monospace,monospace;letter-spacing:.14em;color:var(--muted);margin:0 0 8px}.evidence-scale{font-size:11px;padding:5px 7px;min-width:0;border-radius:4px}.evidence-spectrum canvas{width:100%;height:270px;display:block}.evidence-caption{font:10px ui-monospace,monospace;color:var(--muted);line-height:1.55}.selected-node h4{font-size:19px;line-height:1.2;margin:8px 0}.selected-node p{color:#c0c8ca;font-size:12px;line-height:1.55;max-height:78px;overflow:auto}.selected-node .decision{font-size:14px;color:var(--text);font-weight:620;line-height:1.35}.selected-node .link-row{margin-top:12px}
  .summary{margin:10px 0 30px}.summary-main{padding:15px 19px}.summary-main p{font-size:12px;line-height:1.45;margin:12px 0 0}.winner{font-size:22px}.kpis{margin-top:13px;gap:25px}.number{font-size:14px}.summary .sub-label{font-size:10px}.drawer .decision{font-size:23px;line-height:1.2;margin:7px 0 12px;font-weight:650}.drawer details{margin-top:20px;border-top:1px solid var(--line);padding-top:14px}.drawer summary{cursor:pointer;color:var(--muted);font:11px ui-monospace,monospace;letter-spacing:.08em}.drawer .detail-section{margin-top:18px}

<body>
<div class="shell">
  <header class="top"><div class="logo">FORMA <span>/ REASONING ATLAS</span></div><div class="top-right"><span>Scientific verification · demo run</span><div class="lang-toggle" aria-label="Language / 语言"><button type="button" data-lang="zh" class="active" aria-pressed="true">中文</button><button type="button" data-lang="en" aria-pressed="false">EN</button></div></div></header>
  <section class="hero"><h1 id="sample-headline"></h1><div class="run-pill"><span class="dot"></span><span id="run-label"></span><span data-i18n="RA 前暂定结果">· RA 前暂定结果</span></div></section>
  <nav class="sample-strip" id="samples" aria-label="样本"></nav>
  <div class="section-head"><h2 data-i18n="调查流程 / Investigation graph">调查流程 / Investigation graph</h2><small data-i18n="拖动平移 · 滚轮缩放 · 点击节点查看证据">拖动平移 · 滚轮缩放 · 点击节点查看证据</small></div>
  <section class="graph-shell" aria-label="交互式推理图" data-i18n-aria="交互式推理图">
    <div class="graph-top"><div class="graph-tag" id="graph-title">INVESTIGATION MAP</div><div class="graph-controls"><button id="graph-overview" class="active" data-i18n="全局图">全局图</button><select id="graph-hyp" aria-label="聚焦假设" data-i18n-aria="聚焦假设"><option value="">聚焦假设</option></select><button id="graph-zoom-in" aria-label="放大" data-i18n-aria="放大">＋</button><button id="graph-zoom-out" aria-label="缩小" data-i18n-aria="缩小">－</button><button id="graph-fit" data-i18n="适配">适配</button><button id="graph-fullscreen" data-i18n="全屏">全屏</button></div></div>
    <canvas class="graph-canvas" id="reasoning-canvas" aria-label="交互式推理图" data-i18n-aria="交互式推理图"></canvas>
    <div class="graph-bottom"><span data-i18n="虚线＝调查顺序，不表示严格数据依赖；具体来源见节点产物。青色＝全局图中的 HS 暂定胜出路径，或聚焦图中的当前假设路径；结果待 RA 审查。">虚线＝调查顺序，不表示严格数据依赖；具体来源见节点产物。青色＝全局图中的 HS 暂定胜出路径，或聚焦图中的当前假设路径；结果待 RA 审查。</span><div class="graph-legend"><span><i class="v"></i><span data-i18n="显示路径">显示路径</span></span><span><i class="f"></i><span data-i18n="其他节点">其他节点</span></span></div></div>
  </section>
  <section class="evidence-panel" aria-label="观测证据和所选节点" data-i18n-aria="观测证据和所选节点"><div class="evidence-spectrum"><div class="evidence-head"><h3>OBSERVED SPECTRUM · <span id="evidence-sample"></span></h3><select class="evidence-scale" id="evidence-scale" aria-label="光谱纵轴范围" data-i18n-aria="光谱纵轴范围"><option value="full" data-i18n="纵轴：完整范围">纵轴：完整范围</option><option value="detail" data-i18n="纵轴：细节对比">纵轴：细节对比</option></select></div><canvas id="evidence-canvas" aria-label="所选节点对应的观测光谱" data-i18n-aria="所选节点对应的观测光谱"></canvas><div class="evidence-caption" id="evidence-caption"></div></div><div class="selected-node" id="selected-node"></div></section>
  <section class="summary" id="summary"></section>
  <div class="section-head"><h2 data-i18n="03 / 节点输出">03 / 节点输出</h2><small data-i18n="图中节点与下方卡片均可打开结构化输出">图中节点与下方卡片均可打开结构化输出</small></div>
  <div class="workspace"><aside class="sidebar" id="stages"></aside><main><div class="toolbar"><input class="search" id="search" placeholder="搜索节点、feature ID、谱线或判定…" data-i18n-placeholder="搜索节点、feature ID、谱线或判定…" aria-label="搜索节点" data-i18n-aria="搜索节点"><select id="hyp" aria-label="假设筛选" data-i18n-aria="假设筛选"><option value="">全部假设</option></select><span class="toolbar-count" id="count"></span></div><div class="cards" id="cards"></div><button class="more" id="more" hidden data-i18n="显示更多节点">显示更多节点</button></main></div>
</div>
<div class="veil" id="veil"></div><aside class="drawer" id="drawer" aria-label="节点详情" data-i18n-aria="节点详情" aria-hidden="true"></aside>
<script src="data.js"></script>
<script src="gallery_i18n.js"></script>
<script src="node_graph.js"></script>
<script src="spectrum_panel.js"></script>
<script>
(() => {
  const DATA=window.FORMA_GALLERY_DATA;
  const $=id=>document.getElementById(id);
  const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const state={sample:DATA.samples.findIndex(s=>s.name==='QSO_116'),stage:'GRAPH',hyp:'',query:'',limit:36,selectedId:null,lang:'zh'};
  const t=value=>window.FORMA_I18N.text(value,state.lang);
  const g=value=>window.FORMA_I18N.generated(value,state.lang);
  const lk=value=>window.FORMA_I18N.link(value,state.lang);
  const fmt=v=>typeof v==='number' ? (Number.isInteger(v)?String(v):Number(v).toPrecision(6).replace(/0+$/,'').replace(/\.$/,'')) : v===null?'—':typeof v==='boolean'?(state.lang==='en'?(v?'Yes':'No'):(v?'是':'否')):t(String(v));
  const names={VI:'冻结测量',SH:'SH 线审',FA:'FA 独立投票',ROUTE:'代码路由',GRAPH:'类型图',HS:'HS 合并与比较'};
  const briefText=value=>{const raw=String(value??'');const match=raw.match(/^(\d+) 项 (.+)$/);return state.lang==='en'&&match?`${match[1]} ${match[2]} items`:t(raw);};
  if(state.sample<0)state.sample=0;
  $('run-label').textContent=DATA.run;
  const current=()=>DATA.samples[state.sample];
  const spectrum=window.createSpectrumPanel($('evidence-canvas'),$('evidence-caption'));
  $('evidence-scale').addEventListener('change',e=>spectrum.setScale(e.target.value));
  function applyLanguage(){document.documentElement.lang=state.lang;
    document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n);if(el.parentElement?.classList.contains('run-pill'))el.textContent='· '+t(el.dataset.i18n);});
    document.querySelectorAll('[data-i18n-aria]').forEach(el=>el.setAttribute('aria-label',t(el.dataset.i18nAria)));
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>el.placeholder=t(el.dataset.i18nPlaceholder));
    document.querySelectorAll('[data-lang]').forEach(el=>{const active=el.dataset.lang===state.lang;el.classList.toggle('active',active);el.setAttribute('aria-pressed',String(active));});
    $('graph-hyp').options[0].textContent=t('聚焦假设');
    $('graph-fullscreen').textContent=t(document.fullscreenElement?'退出全屏':'全屏');
  }
  document.addEventListener('click',e=>{const b=e.target.closest('[data-lang]');if(!b||b.dataset.lang===state.lang)return;
    const detailsOpen=$('drawer').querySelector('details')?.open;
    state.lang=b.dataset.lang;applyLanguage();spectrum.setLanguage(state.lang);graph.setLanguage(state.lang);
    renderSamples();renderSummary();renderStages();renderHyp();renderCards();renderHeadline();
    if(state.selectedId!=null){const selected=current().nodes.find(n=>n.id===state.selectedId);selectNode(selected);if($('drawer').classList.contains('open')){openNode(selected.id);if(detailsOpen)$('drawer').querySelector('details').open=true;}}else selectNode(null);
  });
  function decision(n){const o=n.output||{};
    if(n.stage==='FA'&&o['票决'])return t(o['票决']==='signal_present'?'该测量位置有连贯信号':'候选特征未通过真实性投票');
    if(n.stage==='FA'&&o.pair_supported!==undefined)return t(o.pair_supported?'双线获得支持':'双线未获支持');
    if(n.stage==='ROUTE')return o.selected_initial_graph?`${t('调查入口：')}${o.selected_initial_graph}`:t(o.route_status||'入口未决');
    if(n.stage==='GRAPH')return t(o.candidate_type||o.gate_status||o.path_status||o.route_status||o.status||'已记录类型图检查');
    if(n.stage==='HS')return t(o.winner_type||o.winner_group_id||o.status||'已记录比较结果');
    if(n.stage==='SH')return state.lang==='en'?`Reviewed ${o['审查谱线']??'—'} predicted lines`:`已审查 ${o['审查谱线']??'—'} 条预测谱线`;
    if(n.stage==='VI')return state.lang==='en'?`Recorded ${o['CWT features']??'—'} CWT features`:`已记录 ${o['CWT features']??'—'} 个 CWT feature`;
    return t(n.status||'已记录');
  }
  function evidenceSummary(n){const o=n.output||{};
    if(n.stage==='FA'&&o['票决'])return `<div class="evidence-summary"><b>${esc(t('独立投票'))} · ${esc(o['赞成'])} / ${esc(o['独立票数'])} ${esc(t('票支持信号存在'))}</b><span>${esc((o['单票']||[]).map(v=>v.answer==='yes'?t('赞成'):v.answer==='no'?t('反对'):v.answer).join(' · '))} · ${esc(o['中心波长 Å'])} Å · ${esc(t(o['信号类型']))} ${esc(t('候选 feature'))}</span></div>`;
    if(n.stage==='SH')return `<div class="evidence-summary"><b>${esc(o['审查谱线'])} ${esc(t('条谱线审查'))}</b><span>${esc(Object.entries(o['状态分布']||{}).map(([k,v])=>`${k} ${v}`).join(' · '))}</span></div>`;
    if(n.stage==='HS'&&o.reason)return `<div class="evidence-summary"><b>${esc(t('比较依据'))}</b><span>${esc(o.reason)}</span></div>`;
    return `<div class="evidence-summary"><b>${esc(g(n.subtitle))}</b><span>${esc(briefText(n.brief))}</span></div>`;
  }
  function selectNode(n){state.selectedId=n?.id??null;spectrum.setNode(n);$('selected-node').innerHTML=n?
    `<h3>${esc(n.stage)} ${n.hyp?' / '+esc(n.hyp):''} · SELECTED NODE</h3><h4>${esc(g(n.title))}</h4><div class="decision">${esc(decision(n))}</div><p>${n.stage==='FA'&&n.output?.['票决']?`${esc(n.output['赞成'])} / ${esc(n.output['独立票数'])} ${esc(t('票支持'))} · ${esc(n.output['中心波长 Å'])} Å`:esc(briefText(n.brief))}</p><div class="link-row"><button class="more" id="selected-details" style="margin:0;padding:8px 12px">${esc(t('查看证据与完整字段 ↗'))}</button></div>`:
    `<h3>SELECTED NODE</h3><h4>${esc(t('选择图中的节点'))}</h4><p>${esc(t('这里显示节点判断、观测位置与原始证据入口。'))}</p>`;
  }
  function renderSamples(){ $('samples').innerHTML=DATA.samples.map((s,i)=>`<button class="sample ${i===state.sample?'active':''}" data-sample="${i}" aria-pressed="${i===state.sample}"><strong>${esc(s.name)}</strong><span>${esc(s.result.truth?.vi_spectype)} → <b>${esc(t(s.result.winner_type||'弃权'))}</b></span></button>`).join(''); }
  function renderSummary(){const s=current(),r=s.result,t=r.truth||{};
    $('summary').innerHTML=`<div class="summary-main"><span class="sub-label">Provisional outcome / RA pending</span><div class="winner">${esc(window.FORMA_I18N.text(r.winner_type||'显式弃权',state.lang))}</div><div class="sub-label">${esc(r.winner_member_hypotheses?.join(' + ')||window.FORMA_I18N.text('无存活组',state.lang))} · ${esc(r.winner_group_id||window.FORMA_I18N.text('无胜出组',state.lang))}</div><div class="kpis"><div><div class="kpi-label">${esc(window.FORMA_I18N.text('锚红移 z',state.lang))}</div><div class="number accent">${esc(fmt(r.winner_redshift))}</div></div><div><div class="kpi-label">${esc(window.FORMA_I18N.text('专家 VI',state.lang))}</div><div class="number">${esc(t.vi_spectype)} · z ${esc(fmt(t.vi_z))}</div></div><div><div class="kpi-label">|Δz|</div><div class="number">${esc(fmt(r.absolute_vi_redshift_error))}</div></div><div><div class="kpi-label">${esc(window.FORMA_I18N.text('存活假设',state.lang))}</div><div class="number">${esc(r.surviving_hypotheses?.join(' / ')||'—')}</div></div></div><p>${esc(s.comparison_reason||window.FORMA_I18N.text('本次运行没有给出比较理由。',state.lang))} <a href="${esc(s.feature_plot)}" target="_blank">${esc(window.FORMA_I18N.text('查看 VI 特征图 ↗',state.lang))}</a></p></div>`;
  }
  function renderStages(){const s=current();$('stages').innerHTML='<div class="side-title">Browse by stage</div>'+[['ALL','全部节点'],...DATA.stages.map(st=>[st,names[st]])].map(([st,label])=>`<button class="stage-tab ${state.stage===st?'active':''}" data-stage="${st}"><span>${st==='ALL'?'◇':'◈'} ${esc(window.FORMA_I18N.text(label,state.lang))}</span><b>${st==='ALL'?s.nodes.length:s.counts[st]||0}</b></button>`).join('')+`<div class="side-note">${esc(window.FORMA_I18N.text('FA 同一 feature 的独立票合为一张卡；每张卡仍可打开原始票据。',state.lang))}<br><br>${esc(window.FORMA_I18N.text('卡片展示本次运行的记录，不代表最终分类或准确率估计。',state.lang))}</div>`;}
  function renderHyp(){ $('hyp').innerHTML=`<option value="">${esc(t('全部假设'))}</option>`+Array.from({length:6},(_,i)=>`<option value="H${i+1}">H${i+1}</option>`).join('');$('hyp').value=state.hyp;}
  function filtered(){return current().nodes.filter(n=>(state.stage==='ALL'||n.stage===state.stage)&&(!state.hyp||!n.hyp||n.hyp===state.hyp)&&(!state.query||[n.title,g(n.title),n.subtitle,g(n.subtitle),n.brief,briefText(n.brief),n.status,t(n.status),n.hyp,JSON.stringify(n.output)].join(' ').toLowerCase().includes(state.query))).sort((a,b)=>DATA.stages.indexOf(a.stage)-DATA.stages.indexOf(b.stage)||a.order-b.order||(a.hyp||'').localeCompare(b.hyp||'')||a.title.localeCompare(b.title));}
  function renderCards(){const all=filtered(),visible=all.slice(0,state.limit);$('count').textContent=state.lang==='en'?`${all.length} nodes · showing ${visible.length}`:`${all.length} 个节点 · 已显示 ${visible.length}`;
    $('cards').innerHTML=visible.length?visible.map(n=>`<button class="card" data-node="${n.id}" data-stage="${n.stage}"><div class="card-kicker"><span>${esc(n.stage)} ${n.hyp?' / '+esc(n.hyp):''}</span><span class="state">${esc(t(n.status))}</span></div><h3>${esc(g(n.title))}</h3><p>${esc(briefText(n.brief))}</p><div class="bottom"><span>${esc(g(n.subtitle))}</span><strong>${esc(t('展开 ↗'))}</strong></div></button>`).join(''):`<div class="empty">${esc(t('没有匹配的节点。试试清除搜索或筛选。'))}</div>`;
    $('more').hidden=all.length<=state.limit;
  }
  function scalar(v){return v===null||typeof v!=='object';}
  function nice(k){return g(k.replace(/_/g,' ').replace(/angstrom/gi,'Å').replace(/km s/gi,'km/s'));}
  function renderFields(obj){return `<div class="fields">${Object.entries(obj).filter(([,v])=>scalar(v)).map(([k,v])=>`<div class="field"><label>${esc(nice(k))}</label><strong>${esc(fmt(v))}</strong></div>`).join('')}</div>`;}
  function renderComplex(key,value,depth=0){if(depth>2)return '';
    if(Array.isArray(value))return `<div class="detail-section"><h3>${esc(nice(key))} · ${value.length} ${state.lang==='en'?'items':'项'}</h3>${value.length?value.map((item,i)=>scalar(item)?`<div class="list-item"><b>${i+1}.</b> ${esc(fmt(item))}</div>`:`<div class="list-item"><b>${i+1}.</b> ${Object.entries(item).filter(([,v])=>scalar(v)).map(([k,v])=>`${esc(nice(k))}: ${esc(fmt(v))}`).join(' · ')}${Object.entries(item).filter(([,v])=>v&&typeof v==='object').slice(0,3).map(([k,v])=>`<span class="line">${esc(nice(k))}: ${esc(Array.isArray(v)?v.map(x=>scalar(x)?fmt(x):Object.values(x).filter(scalar).slice(0,3).map(fmt).join(' / ')).join(' · '):Object.entries(v).filter(([,x])=>scalar(x)).map(([a,x])=>nice(a)+' '+fmt(x)).join(' · '))}</span>`).join('')}</div>`).join(''):`<div class="list-item">${esc(t('此节点没有排队项或冲突项。'))}</div>`}</div>`;
    if(value&&typeof value==='object')return `<div class="detail-section"><h3>${esc(nice(key))}</h3>${renderFields(value)}${Object.entries(value).filter(([,v])=>v&&typeof v==='object').slice(0,5).map(([k,v])=>renderComplex(k,v,depth+1)).join('')}</div>`;
    return '';
  }
  function openNode(id){const n=current().nodes.find(x=>x.id===Number(id));if(!n)return;const obj=n.output||{};
    selectNode(n);
    $('drawer').innerHTML=`<div class="drawer-head"><div><span class="sub-label">${esc(n.stage)} ${n.hyp?'· '+esc(n.hyp):''} ${n.graph?'· '+esc(n.graph):''}</span><h2>${esc(g(n.title))}</h2></div><div style="display:flex;gap:8px;align-items:start"><div class="lang-toggle" aria-label="Language / 语言"><button type="button" data-lang="zh" class="${state.lang==='zh'?'active':''}" aria-pressed="${state.lang==='zh'}">中文</button><button type="button" data-lang="en" class="${state.lang==='en'?'active':''}" aria-pressed="${state.lang==='en'}">EN</button></div><button class="close" id="close" aria-label="${state.lang==='en'?'Close':'关闭'}">×</button></div></div><div class="decision">${esc(decision(n))}</div>${evidenceSummary(n)}<div class="detail-section"><h3>${esc(t('本次证据 / 原始产物'))}</h3><div class="link-row">${n.links.map(l=>`<a href="${esc(l.href)}" target="_blank" rel="noopener">${esc(lk(l.label))} ↗</a>`).join('')}</div></div><details><summary>${esc(t('完整结构化字段 · 展开'))}</summary><div class="detail-section"><h3>${esc(t('节点输出'))}</h3>${renderFields(obj)}</div>${Object.entries(obj).filter(([,v])=>v&&typeof v==='object').slice(0,14).map(([k,v])=>renderComplex(k,v)).join('')}</details><p class="caveat">${esc(t('字段来自本次运行产物；长篇会话和摘要校验请查看原始记录。'))}</p>`;
    $('drawer').classList.add('open');$('veil').classList.add('open');$('drawer').setAttribute('aria-hidden','false');$('close').focus();
  }
  function closeNode(){$('drawer').classList.remove('open');$('veil').classList.remove('open');$('drawer').setAttribute('aria-hidden','true');}
  const graph=window.createNodeGraph($('reasoning-canvas'),{
    onNode:n=>n.id!=null?(selectNode(current().nodes.find(x=>x.id===n.id)),document.querySelector('.evidence-panel').scrollIntoView({behavior:'smooth',block:'nearest'})):(state.stage=n.stage||'ALL',state.hyp=n.hyp||'',state.limit=36,renderStages(),renderHyp(),renderCards(),document.querySelector('.workspace').scrollIntoView({behavior:'smooth',block:'start'})),
    onMode:mode=>{$('graph-title').textContent=mode==='overview'?(state.lang==='en'?'INVESTIGATION MAP':'调查图 / INVESTIGATION MAP'):mode+(state.lang==='en'?' / NODE PATH':' / 节点路径');$('graph-overview').classList.toggle('active',mode==='overview');$('graph-hyp').value=mode==='overview'?'':mode;}
  });
  function renderHeadline(){$('sample-headline').innerHTML=`${esc(current().name)} <em>· ${esc(t(current().result.winner_type||'显式弃权'))}${current().result.winner_redshift!=null?' · z '+esc(fmt(current().result.winner_redshift)):''}</em>`;}
  function render(){renderSamples();renderSummary();renderStages();renderHyp();renderCards();renderHeadline();$('evidence-sample').textContent=current().name;spectrum.setSample(current());selectNode(null);graph.setSample(current());}
  $('samples').addEventListener('click',e=>{const b=e.target.closest('[data-sample]');if(!b)return;state.sample=Number(b.dataset.sample);state.stage='GRAPH';state.hyp='';state.query='';state.limit=36;$('search').value='';render();});
  $('stages').addEventListener('click',e=>{const b=e.target.closest('[data-stage]');if(!b)return;state.stage=b.dataset.stage;state.limit=36;renderStages();renderCards();});
  $('cards').addEventListener('click',e=>{const b=e.target.closest('[data-node]');if(b)openNode(b.dataset.node);});
  $('selected-node').addEventListener('click',e=>{if(e.target.closest('#selected-details')&&state.selectedId!=null)openNode(state.selectedId);});
  $('drawer').addEventListener('click',e=>{if(e.target.closest('#close'))closeNode();});$('veil').addEventListener('click',closeNode);
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeNode();});
  $('search').addEventListener('input',e=>{state.query=e.target.value.trim().toLowerCase();state.limit=36;renderCards();});
  $('hyp').addEventListener('change',e=>{state.hyp=e.target.value;state.limit=36;renderCards();});
  $('more').addEventListener('click',()=>{state.limit+=36;renderCards();});
  $('graph-overview').addEventListener('click',()=>graph.setMode('overview'));
  $('graph-hyp').innerHTML=`<option value="">${esc(t('聚焦假设'))}</option>`+Array.from({length:6},(_,i)=>`<option value="H${i+1}">H${i+1}</option>`).join('');
  $('graph-hyp').addEventListener('change',e=>graph.setMode(e.target.value||'overview'));
  $('graph-fit').addEventListener('click',()=>graph.fit());
  $('graph-zoom-in').addEventListener('click',()=>graph.zoom(1.2));
  $('graph-zoom-out').addEventListener('click',()=>graph.zoom(1/1.2));
  $('graph-fullscreen').addEventListener('click',()=>document.fullscreenElement?document.exitFullscreen():document.querySelector('.graph-shell').requestFullscreen());
  document.addEventListener('fullscreenchange',()=>$('graph-fullscreen').textContent=t(document.fullscreenElement?'退出全屏':'全屏'));
  applyLanguage();render();
})();
</script>
</body>
</html>
